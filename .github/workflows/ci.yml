name: UniParkingBuddy checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint, build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build
      - name: Run frontend regression tests
        run: npm test

  backend-unit-tests:
    name: Backend polygon and configuration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install isolated unit-test dependencies
        run: python -m pip install numpy opencv-python-headless flask flask-cors 'psycopg[binary]>=3.2,<4'
      - name: Run backend unit tests
        run: python -m unittest discover -s backend/tests -p 'test_*.py' -v

  postgresql-integration-tests:
    name: PostgreSQL persistence integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uniparkingbuddy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d uniparkingbuddy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/uniparkingbuddy_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install database test driver
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Test PostgreSQL schema and repository transactions
        run: python -m unittest discover -s backend/tests -p 'test_occupancy_repository.py' -v
